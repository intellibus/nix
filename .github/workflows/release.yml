name: 📦 Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  create-release:
    name: 🎉 Create Release
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: nixos-x86_64
            runs-on: ubuntu-24.04      # Native x86_64 runner
          - config: nixos-aarch64
            runs-on: ubuntu-24.04-arm64  # Native ARM64 runner
    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ❄️ Install Nix
        uses: cachix/install-nix-action@v26
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: 🧪 Final validation and build
        run: |
          echo "🔍 Checking flake..."
          nix flake show
          nix flake check

          echo "🏗️ Building NixOS (${{ matrix.config }})..."
          nix build .#nixosConfigurations.${{ matrix.config }}.config.system.build.toplevel --no-link -L

          echo "🏠 Building Home Manager (${{ matrix.config }})..."
          nix build .#homeConfigurations."absurdprofit@${{ matrix.config }}".activationPackage --no-link -L

      - name: 📦 Create tarball
        run: |
          TAR="nixos-config-$(git describe --tags --abbrev=0)-${{ matrix.config }}.tar.gz"
          tar -czf "$TAR" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='*.tar.gz' \
            .
          echo "TAR=$TAR" >> $GITHUB_ENV

      - name: 🎉 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.TAR }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📢 Post-release notification
        run: |
          echo "🎉 Release created successfully for ${{ matrix.config }}!"
